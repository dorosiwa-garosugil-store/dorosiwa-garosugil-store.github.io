<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>DOROSIWA 가로수길점 · 스토어 허브</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--ink:#16171a;--mut:#7a7d85;--edge:#e6e6e9;--soft:#f1f1f3;--acc:#16171a;--rev:#fff;--dan:#c0283a;--ok:#1f7a45;--cl:92%;--cd:28%;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not(.light){--bg:#0d0f12;--card:#17191d;--ink:#f3f4f6;--mut:#9a9ea8;--edge:#2c2f35;--soft:#22252b;--acc:#f3f4f6;--rev:#111317;--dan:#ff8d99;--ok:#8fe0ad;--cl:24%;--cd:84%;color-scheme:dark}}
:root.dark{--bg:#0d0f12;--card:#17191d;--ink:#f3f4f6;--mut:#9a9ea8;--edge:#2c2f35;--soft:#22252b;--acc:#f3f4f6;--rev:#111317;--dan:#ff8d99;--ok:#8fe0ad;--cl:24%;--cd:84%;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 14px calc(140px + var(--sb))}
header{padding:calc(var(--st) + 14px) 2px 6px;display:flex;align-items:center;gap:8px}
header .t{flex:1;min-width:0}
.eb{font-size:10px;letter-spacing:1.6px;color:var(--mut);font-weight:700}
h1{margin:2px 0 0;font-size:22px;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{height:36px;padding:0 12px;border-radius:18px;background:var(--card);border:1px solid var(--edge);font-size:12.5px;font-weight:650;white-space:nowrap}
.pill.on{background:var(--acc);color:var(--rev);border-color:var(--acc)}
.ib{width:36px;height:36px;border-radius:18px;background:var(--card);border:1px solid var(--edge);display:grid;place-items:center;flex:0 0 36px}
.ib svg{width:17px;height:17px}
.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.adminbar{background:var(--acc);color:var(--rev);border-radius:12px;padding:8px 12px;font-size:12px;font-weight:650;display:flex;align-items:center;gap:8px;margin:6px 0}
.adminbar button{margin-left:auto;color:inherit;opacity:.75;font-size:12px;font-weight:650}
.note{background:color-mix(in srgb,#e0a100 16%,transparent);color:inherit;border-radius:10px;padding:8px 12px;font-size:12px;margin:6px 0}
.card{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:14px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:650;display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:22px;font-weight:750;letter-spacing:-.5px}
.mut{color:var(--mut);font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.link{color:var(--mut);font-size:12px;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:24px 8px;font-size:13px;line-height:1.6}
.btn{height:42px;padding:0 14px;border-radius:11px;border:1px solid var(--edge);background:var(--card);font-size:13px;font-weight:650;white-space:nowrap}
.btn.pri{background:var(--acc);color:var(--rev);border-color:var(--acc)}
.btn.sm{height:32px;padding:0 10px;font-size:12px;border-radius:9px}
.btn.dan{color:var(--dan)}
.btn:disabled{opacity:.4}
input[type=text],input[type=number],textarea,select.f{width:100%;border:1px solid var(--edge);background:var(--card);border-radius:11px;padding:10px 12px;font-size:16px}
textarea{resize:vertical;min-height:100px;line-height:1.55}
label.f{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;font-weight:600}
.seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;margin:10px 0}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:12.5px;font-weight:650;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0000001a}
.chip{display:inline-flex;align-items:center;justify-content:center;padding:4px 8px;border-radius:7px;font-size:12px;font-weight:650;white-space:nowrap;background:hsl(var(--h,0) var(--s,0%) var(--cl));color:hsl(var(--h,0) calc(var(--s,0%)*.8) var(--cd))}
.chip.g{background:var(--soft);color:var(--mut)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 8px;margin:0 -14px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;min-width:46px;padding:7px 4px;border-radius:12px;background:var(--card);border:1px solid var(--edge);text-align:center}
.strip b{display:block;font-size:16px}
.strip small{display:block;font-size:10px;color:var(--mut)}
.strip .on{background:var(--acc);color:var(--rev);border-color:var(--acc)}
.strip .on small{color:inherit;opacity:.75}
.strip .today:not(.on){border-color:var(--ink)}
.sun b{color:#d23}.sat b{color:#36c}.on b{color:inherit!important}
.li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--edge)}
.li:last-child{border-bottom:0}
.li .nm{font-weight:650}.li .rl{font-size:11px;color:var(--mut)}
.li.me{background:var(--soft);border-radius:10px;padding:10px 8px;border-bottom:0}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names span{background:var(--soft);padding:5px 9px;border-radius:8px;font-size:13px;font-weight:600}
.names span small{opacity:.6;font-weight:500}
.names span.me{background:var(--acc);color:var(--rev)}
.grp{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--edge)}
.grp:last-child{border-bottom:0}
.grp .gh{width:86px;flex:0 0 86px}
.tbl{overflow:auto;border:1px solid var(--edge);border-radius:13px;background:var(--card);max-height:70vh}
.tbl table{border-collapse:separate;border-spacing:0;font-size:11px;white-space:nowrap}
.tbl th,.tbl td{padding:4px 3px;text-align:center;border-bottom:1px solid var(--edge);border-right:1px solid var(--edge);height:34px}
.tbl thead th{position:sticky;top:0;background:var(--soft);z-index:2;line-height:1.15}
.tbl th small,.tbl td small{display:block;font-size:9.5px;color:var(--mut);font-weight:500}
.tbl th:first-child,.tbl td:first-child{position:sticky;left:0;background:var(--card);z-index:1;text-align:left;padding:4px 7px;min-width:66px}
.tbl thead th:first-child{z-index:3;background:var(--soft)}
.tbl .chip{padding:3px 4px;font-size:10.5px;border-radius:5px;min-width:38px}
.tbl .tc{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.tbl th.wsun,.tbl th.wsun small{color:#d23}.tbl th.wsat,.tbl th.wsat small{color:#36c}
.tbl .sr{position:sticky;background:var(--card);z-index:1;min-width:var(--sw);width:var(--sw);font-size:11.5px;padding:4px 1px!important}
.tbl{--sw:38px}@media (min-width:900px){.tbl{--sw:48px}}
.tbl thead .sr{z-index:3;background:var(--soft);font-weight:700}
.tbl tr.tot .sr{background:var(--soft)}
.tbl .sr0{right:calc(var(--sw) * 3);box-shadow:-2px 0 0 var(--edge)}.tbl .srl{box-shadow:-2px 0 0 var(--edge)}.tbl .sr1{right:calc(var(--sw) * 2)}.tbl .sr2{right:var(--sw)}.tbl .sr3{right:0}
.tbl tr.tot td{background:var(--soft);font-weight:700}
.tbl tr.me td:first-child{font-weight:800}
.tbl td.tap{cursor:pointer}
.tbl select{border:0;border-radius:6px;padding:5px 2px;font-size:11px;font-weight:650;min-width:74px;-webkit-appearance:none;appearance:none;text-align:center;background:hsl(var(--h,0) var(--s,0%) var(--cl));color:hsl(var(--h,0) calc(var(--s,0%)*.8) var(--cd))}
.notice .tt{font-size:15px;font-weight:700}
.notice .bd{white-space:pre-wrap;line-height:1.65;margin-top:8px;overflow-wrap:anywhere}
.guide{white-space:pre-wrap;line-height:1.7;font-size:13px;color:var(--mut)}
.warn{background:color-mix(in srgb,var(--dan) 12%,transparent);color:var(--dan);padding:7px 10px;border-radius:9px;font-size:12px;margin:4px 0}
.okm{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);padding:7px 10px;border-radius:9px;font-size:12px;margin:4px 0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--edge);padding-bottom:var(--sb)}
nav .in{max-width:640px;margin:0 auto;display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:10.5px;color:var(--mut);font-weight:600}
nav svg{width:22px;height:22px}
nav .on{color:var(--ink)}
.scrim{position:fixed;inset:0;background:#0006;z-index:50;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;display:none;justify-content:center}
.open{display:flex!important}
.sheet .in{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + var(--sb));max-height:86vh;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:17px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pick button{padding:12px 4px;border-radius:11px;background:var(--soft);font-weight:650}
.pick button.sel{outline:2.5px solid var(--ink);outline-offset:1px}
.toast{position:fixed;left:50%;bottom:calc(132px + var(--sb));transform:translate(-50%,16px);background:var(--acc);color:var(--rev);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--dan);color:#fff}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:112px}
.tile svg{width:24px;height:24px;margin-bottom:4px}
.tile b{font-size:15px}
.tile small{font-size:12px;color:var(--mut)}
.tile.off{opacity:.45}
.tile:not(.off):active{transform:scale(.98)}
.udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e5383b;margin-right:6px;vertical-align:middle;position:relative;top:-1px}
.ndot{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:#e5383b}
nav button{position:relative}
.tile{position:relative}.tile .tdot{position:absolute;top:14px;right:14px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#e5383b;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
#viewer{display:none;position:fixed;inset:0;z-index:80;background:var(--bg);flex-direction:column}
#viewer .vtop{display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 10px) 14px 10px;border-bottom:1px solid var(--edge);background:var(--card)}
#viewer .vbody{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px;touch-action:pan-x pan-y pinch-zoom}
#viewer img{width:100%;max-width:820px;border-radius:8px;box-shadow:0 1px 6px #0002;background:#fff}
#ptr{position:fixed;left:0;right:0;top:0;z-index:70;display:flex;justify-content:center;pointer-events:none;transform:translateY(-70px);transition:transform .18s}
#ptr .ptr-in{margin-top:calc(var(--st) + 10px);background:var(--acc);color:var(--rev);border-radius:20px;padding:8px 16px;font-size:13px;font-weight:650;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px #0003}
#ptr .ptr-ic{display:inline-block;transition:transform .15s}
#ptr.ready .ptr-ic{transform:rotate(180deg)}
#ptr.loading .ptr-ic{animation:sp .8s linear infinite}
#ptr.show{transition:none}
.foot{text-align:center;color:var(--mut);font-size:11px;margin:20px 0 6px}

/* 노트북·PC 화면: 넓게 써서 표를 한눈에 */
@media (min-width:900px){
 .wrap{max-width:1180px;padding-left:24px;padding-right:24px}
 nav .in,.sheet .in{max-width:1180px}
 #saveBar{max-width:1132px!important}
 .hub{grid-template-columns:repeat(4,1fr)}
 .tbl{max-height:calc(100vh - 300px)}
 .tbl table{font-size:12px}
 .tbl .chip{font-size:11.5px;min-width:44px}
 .strip{margin:0;padding-left:0;padding-right:0}
 .tbl table{min-width:100%}
 .sheet .in{max-width:560px;border-radius:20px;margin-bottom:24px}
}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
</style>
</head>
<body>
<div id="gate" style="display:none;position:fixed;inset:0;z-index:100;background:var(--bg);align-items:center;justify-content:center;padding:24px">
 <div style="width:min(360px,100%)">
  <div style="width:56px;height:56px;border-radius:16px;background:var(--acc);color:var(--rev);display:grid;place-items:center;font-weight:800;font-size:22px;margin-bottom:16px">D</div>
  <div class="eb">DOROSIWA · STORE HUB</div><h1 style="margin:4px 0 6px">가로수길점</h1>
  <div class="mut">매장 공용 비밀번호를 입력하세요.</div>
  <input type="password" id="gpw" placeholder="비밀번호" style="margin-top:16px" autocomplete="current-password">
  <button class="btn pri" id="gok" style="width:100%;height:48px;margin-top:10px;font-size:15px">들어가기</button>
  <div id="gerr" style="color:var(--dan);font-size:12px;min-height:18px;margin-top:8px"></div>
 </div>
</div>
<div class="wrap">
 <header>
  <div class="t"><div class="eb">DOROSIWA · STORE HUB</div><h1 id="ttl">가로수길점</h1></div>
  <button class="pill" id="meBtn">내 이름</button>
  <button class="ib" id="refBtn" aria-label="새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
 </header>
 <div id="bars"></div>
 <main id="view"><div class="card empty">불러오는 중…</div></main>
 <div class="foot" id="foot"></div>
</div>
<nav><div class="in">
 <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
 <button data-tab="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>먼슬리</button>
 <button data-tab="daily"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>데일리</button>
 <button data-tab="notice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 10v4a1 1 0 0 0 1 1h2l6 4V5L7 9H5a1 1 0 0 0-1 1z"/><path d="M17 8.5a5 5 0 0 1 0 7"/></svg>공지</button>
 <button data-tab="set" id="setTab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>설정</button>
</div></nav>
<div id="saveBar" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(66px + var(--sb));z-index:35;max-width:616px;margin:0 auto;background:var(--acc);color:var(--rev);border-radius:14px;padding:9px 10px 9px 14px;align-items:center;gap:8px;font-size:13px;font-weight:650;box-shadow:0 8px 24px #0003"></div>
<div id="ptr"><div class="ptr-in"><span class="ptr-ic">↓</span><span class="ptr-tx">당겨서 새로고침</span></div></div>
<div id="viewer"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script>
/* 화면 모드: 자동(폰 설정 따름) / 라이트 / 다크 */
function applyTheme() { let t = 'auto'; try { t = JSON.parse(localStorage.getItem('dsh_theme')) || 'auto'; } catch {} document.documentElement.classList.toggle('dark', t === 'dark'); document.documentElement.classList.toggle('light', t === 'light'); }
applyTheme();
/* 폰에서 손가락 확대·두 번 탭 확대 막기 */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.scale !== undefined && e.scale !== 1) e.preventDefault(); }, {passive:false});

/* DOROSIWA STORE HUB
   데이터 위치 (페이지 데이터베이스):
   hub/config          매장 이름·영업시간·직원 목록·포지션·근무시간 선택지·휴무 종류·운영 가이드
   months/YYYY-MM      { staff: { 이름: { 날짜: '11~20' | '휴' ... } } }
   daily/YYYY-MM-DD    { published: true/false, assign: { 이름: [영업 시작 시각부터 1시간 단위 포지션, 근무 외 null] } }
   notices/<id>        { title, body, pinned, date }
   링크 끝에 #admin 을 붙이면 관리자 화면 (편집 권한이 있는 계정에서만 동작) */
const $ = id => document.getElementById(id);
const esc = x => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = { get(k, d) { try { const v = localStorage.getItem('dsh_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('dsh_' + k, JSON.stringify(v)); } catch {} } };
const WD = ['일','월','화','수','목','금','토'], pad = n => String(n).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o));
function now() { const p = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', hourCycle:'h23'}).formatToParts(new Date()); const g = t => p.find(x => x.type === t).value; return {date:`${g('year')}-${g('month')}-${g('day')}`, hour:+g('hour') % 24}; }
const shift = v => { const m = String(v || '').trim().match(/^(\d{1,2})(?::(\d{2}))?\s*[~\-–]\s*(\d{1,2})(?::(\d{2}))?$/); if (!m) return null; const s = +m[1] + (+(m[2] || 0)) / 60, e = +m[3] + (+(m[4] || 0)) / 60; return s < e ? {s, e} : null; };
const normShift = v => String(v || '').trim().replace(/\s+/g, '').replace(/[–-]/g, '~');

/* ───────── 상태 ───────── */
let T = now();
const DEF = {store:'가로수길점', hours:{open:11, close:20}, staff:[], positions:[], shiftPresets:[], absences:['휴','요청휴무','연차'], guide:''};
const D = ls.get('cache', {config:null, months:{}, daily:{}, notices:[]});
const S = {
  tab:'today', me:ls.get('me', ''), canEdit:!!ls.get('ghToken', ''), dirty:0, sha:null, saving:false, db:null, ready:false, synced:false, offline:false,
  month:T.date.slice(0, 7), mView:ls.get('mView2', 'table'), mDate:T.date,
  dDate:T.date, dView:ls.get('dView2', 'table'), dHour:null, edit:null
};
(() => { try { const v = JSON.parse(sessionStorage.getItem('dsh_view') || 'null'); if (v) { Object.assign(S, v); sessionStorage.removeItem('dsh_view'); } } catch {} })();
const C = () => Object.assign({}, DEF, D.config || {});
const admin = () => S.canEdit;
const HOURS = () => { const h = C().hours; return Array.from({length:Math.max(0, h.close - h.open)}, (_, i) => h.open + i); };

/* ───────── 색 ───────── */
const HUES = [212, 150, 330, 38, 265, 188, 20, 95, 300, 170, 0, 240];

function unlocked() { const u = ls.get('unlock', null); return u && u.h === PASS_HASH && u.until > Date.now(); }
async function tryUnlock() {
  if ((await sha($('gpw').value.trim())) !== PASS_HASH) { $('gerr').textContent = '비밀번호가 맞지 않아요.'; return; }
  ls.set('unlock', {h:PASS_HASH, until:Date.now() + 30 * 864e5}); $('gate').style.display = 'none'; render(); loadData(); if (S.canEdit) loadAdminExp();
}
$('gok').onclick = tryUnlock; $('gpw').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
if (unlocked()) { render(); loadData(); if (S.canEdit) loadAdminExp(); } else { $('gate').style.display = 'flex'; }
</script>
